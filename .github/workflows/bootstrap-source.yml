name: Bootstrap source
on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and restore source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-xz/000.txt .bootstrap-xz/001.txt | tr -d '\r\n' | base64 -d > rebuilt-source.tar.xz
          xz -t rebuilt-source.tar.xz
          xz -dc rebuilt-source.tar.xz | tar -xf -
          rm -rf .bootstrap .bootstrap-xz .transfer
          rm -f rebuilt-source.tar.xz .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish project source"
          git push
