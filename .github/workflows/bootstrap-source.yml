name: Bootstrap source
on:
  push:
    paths:
      - ".bootstrap/source.tar.xz"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          xz -dc .bootstrap/source.tar.xz | tar -xf -
          rm -rf .bootstrap .bootstrap-xz .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish project source"
          git push
