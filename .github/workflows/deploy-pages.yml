name: Build portfolio live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-live-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static demo
        run: npm exec vite build -- --base=./ --outDir=dist-pages
      - name: Upload live demo
        uses: actions/upload-artifact@v4
        with:
          name: live-demo-pulsepilot
          path: dist-pages
          if-no-files-found: error
