name: Publish clean source
on:
  push:
    paths:
      - ".github/workflows/publish-source.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-clean/000.txt .bootstrap-clean/001.txt .bootstrap-clean/002.txt .bootstrap-clean/003.txt .bootstrap-clean/004.txt .bootstrap-clean/005.txt .bootstrap-clean/006.txt .bootstrap-clean/007.txt .bootstrap-clean/008.txt .bootstrap-clean/009.txt | tr -d '\r\n' | base64 -d > source.zip
          echo "18017b897fcd0be7c557f32df1d47edeee733af5a9de662336dc182565a6ef9e  source.zip" | sha256sum -c -
          unzip -o source.zip
          rm -rf .bootstrap-clean .bootstrap .bootstrap-xz .bootstrap-parts .transfer
          rm -f source.zip .github/workflows/publish-source.yml .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish project source"
          git push
